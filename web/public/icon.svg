<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- The answer screen's staff: a first tone then a second (fāngmén), in the tone colors, framed
       as a staff is. Only levels 5 to 2 are drawn, so the high tones fill the square. -->
  <rect width="100" height="100" fill="#f1f5f9"/>
  <rect width="8" height="100" fill="#334155"/>
  <g stroke="#cbd5e1" stroke-width="1.8">
    <path d="M18 28 H92"/><path d="M18 46 H92"/><path d="M18 64 H92"/><path d="M18 82 H92"/>
  </g>
  <path d="M44 28 L54 64" stroke="#a8a29e" stroke-width="4.5" stroke-dasharray="1 7" stroke-linecap="round"/>
  <path d="M22 28 H44" stroke="#dc2626" stroke-width="10" stroke-linecap="round"/>
  <path d="M54 64 C72 64 76 28 90 28" fill="none" stroke="#ea8c00" stroke-width="10" stroke-linecap="round"/>
</svg>
